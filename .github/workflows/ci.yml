name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database lang public routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run automated tests
        run: php artisan test
